<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e8b57">
<link rel="manifest" href="manifest.json">
<title>Carga</title>
<style>
:root{--bg:#f5f5f2;--fg:#1c1c1a;--card:#fff;--mut:#6b6b66;--bd:#d6d6d0;--ok:#2e8b57;--b1:#c9dcf2;--b2:#f2dcc0;--b3:#d8ecd0;--b4:#eed0e0;--b5:#e6e0b8;--b6:#cfe6e6}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a18;--fg:#eeeeea;--card:#262624;--mut:#a0a09a;--bd:#3d3d3a;--b1:#2c4663;--b2:#6a4a25;--b3:#385a30;--b4:#6a3a55;--b5:#5e5a28;--b6:#2d5a5a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 6px}h2{font-size:16px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.m{color:var(--mut);font-size:13px}.w{color:#b3402a;font-size:13px}
.r{padding:7px 0;border-bottom:1px solid var(--bd)}.r:last-child{border:0}
input{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px;width:58px;font-size:15px}
input[type=checkbox]{width:auto}#d{width:100%;box-sizing:border-box}
label{display:inline-block;margin:3px 6px 3px 0}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;margin:3px 3px 3px 0;font-size:15px}
.p{background:var(--ok);color:#fff;border:0}
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.bd{stroke:var(--fg);stroke-width:.5;cursor:pointer}.done{opacity:.4}
text{fill:var(--fg);font-size:6.3px;pointer-events:none;text-anchor:middle}
.sv{width:var(--sw,100%);max-width:100%}.lays{display:flex;flex-wrap:wrap;gap:0 16px;align-items:flex-start}.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
</style></head><body>
<h1>Carga</h1>
<div class="card"><b>Foto do mapa</b><br>
<input type="file" id="f" accept="image/*"><button id="ocr" class="p">Ler mapa</button>
<div id="st" class="m"></div>
<details id="rawd" style="display:none"><summary class="m">Texto lido (ajuda a corrigir)</summary><pre id="raw" class="m" style="white-space:pre-wrap"></pre></details>
<img id="pv" alt="" style="display:none;width:100%;border-radius:8px;margin-top:8px"></div>
<div class="card"><b>Ou escreve uma linha</b>
<label style="display:block">Descrição<br><input id="d" placeholder="ex. TUBO QUAD 60,0 x 4,00 S355J2H"></label>
<label>Comp. (m)<br><input id="c" type="number" step="any" inputmode="decimal"></label>
<label>Peças<br><input id="p" type="number" inputmode="numeric"></label>
<label>Atados<br><input id="at" type="number" step="any" inputmode="decimal"></label>
<label>Peso (kg)<br><input id="k" type="number" inputmode="numeric"></label>
<label>Local<br><input id="lo" placeholder="F01B04"></label><br>
<button id="add" class="p">Adicionar linha</button><div id="er" class="w"></div></div>
<div id="L"></div><div id="LC"></div>
<button id="go" class="p">Gerar plano</button><button id="clr">Limpar mapa</button>
<div id="out"></div>
<script>
var S={lines:[],order:[],defs:{},done:{},nid:1,planned:false,useOrd:true,zoom:0},O=[],LT=1360,W=245;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('carga1')||'{}'))}catch(e){}
function sv(){try{localStorage.setItem('carga1',JSON.stringify(S))}catch(e){}}
var G=function(i){return document.getElementById(i)},nm=function(x){return parseFloat(String(x).replace(',','.'))||0};
function fmt(k){return Math.round(k).toLocaleString('pt-PT')}
function parse(d){var s=d.toUpperCase().replace(/,/g,'.'),m;
if(/RED/.test(s)&&(m=s.match(/RED\D*?([\d.]+)\s*X\s*([\d.]+)/)))return{tipo:'RED',a:+m[1],b:+m[1],esp:+m[2]};
if(/RECT/.test(s)&&(m=s.match(/RECT\D*?([\d.]+)\s*X\s*([\d.]+)\s*X\s*([\d.]+)/)))return{tipo:'RECT',a:Math.max(+m[1],+m[2]),b:Math.min(+m[1],+m[2]),esp:+m[3]};
if(/QUAD/.test(s)&&(m=s.match(/QUAD\D*?([\d.]+)\s*X\s*([\d.]+)/)))return{tipo:'QUAD',a:+m[1],b:+m[1],esp:+m[2]};return null}
function lab(l){return l.tipo+' '+l.a+'×'+(l.tipo=='RECT'?l.b+'×':'')+l.esp}
function key(l){return l.tipo+l.a+'x'+l.b+'x'+l.esp+'/'+l.comp}
function nb(l){return Math.max(1,Math.ceil(l.atados-1e-6))}
function dims(l){var n=Math.max(1,Math.round(l.pecas/nb(l))),c=(l.B&&l.A)?[l.B,l.A]:S.defs[key(l)],a=l.a/10,b=l.b/10,B,A,w,h,R=l.tipo=='RED';
if(c){B=c[0];A=c[1];w=B*(R?a:Math.max(a,b));h=A*(R?a*.87:Math.min(a,b))}
else if(R){w=h=a*Math.sqrt(.866*n);B=A=0}
else{var bg=Math.max(a,b),sl=Math.min(a,b),best=1e9;B=1;A=n;for(var i=1;i<=n;i++){if(n%i)continue;var j=n/i,d=Math.abs(i*bg-j*sl);if(d<best-1e-9){best=d;B=i;A=j}}w=B*bg;h=A*sl}
w=Math.round(w);h=Math.round(h);if(l.rot){var t=w;w=h;h=t}return{w:w,h:h,B:B,A:A}}
function find(i){return S.lines.filter(function(l){return l.id==i})[0]}
function syncOrder(){var u=[];S.lines.forEach(function(l){if(l.mine&&u.indexOf(l.loc)<0)u.push(l.loc)});S.order=S.order.filter(function(x){return u.indexOf(x)>=0});u.forEach(function(x){if(S.order.indexOf(x)<0)S.order.push(x)})}
G('add').onclick=function(){var p=parse(G('d').value);if(!p){G('er').textContent='Não percebi a descrição. Ex.: TUBO QUAD 60,0 x 4,00 | TUBO RECT 120x60x8 | TUBO RED 114,3x3';return}
var l=Object.assign(p,{id:S.nid++,comp:nm(G('c').value),pecas:nm(G('p').value),atados:nm(G('at').value)||1,kg:nm(G('k').value),loc:G('lo').value.trim().toUpperCase(),mine:true,B:0,A:0,rot:false});
if(!l.comp||!l.pecas||!l.kg){G('er').textContent='Faltam comprimento, peças ou peso.';return}
G('er').textContent='';S.lines.push(l);['d','c','p','at','k'].forEach(function(i){G(i).value=''});rl()};
function loadT(){return window.Tesseract?Promise.resolve():new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=function(){no(new Error('Sem internet para carregar o leitor (só é preciso da primeira vez).'))};document.head.appendChild(s)})}
function prep(f){return createImageBitmap(f).then(function(b){var k=Math.min(2,2400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);var x=c.getContext('2d');x.filter='grayscale(1) contrast(1.5)';x.drawImage(b,0,0,c.width,c.height);return c})}
function ocrLines(t){var L=t.split('\n'),n=0;
for(var i=0;i<L.length;i++){var s=L[i],m=s.match(/(\d[\d.,]*)\s+TUBO\s+(?:RECT|QUAD|RED)/i);if(!m)continue;
var tail=s.slice(s.search(/TUBO/i)),p=parse(tail),cm=tail.match(/\b(\d{1,2})[.,]000\b/);if(!p||!cm)continue;
var rest=tail.slice(tail.indexOf(cm[0])+cm[0].length).match(/\d[\d.,]*/g)||[],pc=parseInt((rest[0]||'').replace(/[.,]/g,'')),kg=parseInt((rest[1]||'').replace(/[.,]/g,'')),loc='';
for(var j=i;j<Math.min(L.length,i+3);j++){var q=L[j].match(/LOCALIZ\S*[^A-Za-z0-9]*([A-Za-z0-9]{4,7})/i);if(q){loc=q[1].toUpperCase().replace(/O/g,'0').replace(/I/g,'1');break}}
if(!pc||!kg)continue;
S.lines.push(Object.assign(p,{id:S.nid++,comp:+cm[1],pecas:pc,atados:nm(m[1].replace(/\./g,''))||1,kg:kg,loc:loc,mine:false,B:0,A:0,rot:false}));n++}
rl();return n}
G('ocr').onclick=async function(){var f=G('f').files[0];if(!f){G('st').textContent='Escolhe primeiro a foto do mapa.';return}
G('pv').src=URL.createObjectURL(f);G('pv').style.display='block';
try{G('st').textContent='A preparar o leitor...';await loadT();var c=await prep(f);
var w=await Tesseract.createWorker('por',1,{logger:function(m){if(m.status)G('st').textContent=m.status+(m.progress?' '+Math.round(m.progress*100)+'%':'')}});
await w.setParameters({tessedit_pageseg_mode:'6'});var r=await w.recognize(c);await w.terminate();
G('raw').textContent=r.data.text;G('rawd').style.display='block';var n=ocrLines(r.data.text);
G('st').textContent=n?('Li '+n+' linhas. Marca as que são tuas e confere os números.'):'Não consegui ler linhas. Vê o texto lido ou escreve à mão.'}
catch(e){G('st').textContent='Erro: '+(e.message||e)}};
G('clr').onclick=function(){if(confirm('Apagar as linhas e o plano deste mapa? (as configurações guardadas ficam)')){S.lines=[];S.order=[];S.done={};S.planned=false;rl();G('out').innerHTML='';G('pv').style.display='none';G('rawd').style.display='none';G('st').textContent=''}};
function rl(){syncOrder();var h='<h2>2. Linhas</h2><div class="card"><div class="m">Marca as linhas que são tuas (as que têm T2, 130, G ou C escrito à mão).</div><button data-a="all">Marcar todas</button>';
S.lines.forEach(function(l){var d=dims(l),i=l.id;h+='<div class="r"><label><input type="checkbox" data-a="mine" data-i="'+i+'"'+(l.mine?' checked':'')+'> <b>'+lab(l)+'</b></label><span class="m">'+l.comp+' m · '+l.pecas+' peças · '+l.atados+' atados · '+fmt(l.kg)+' kg · '+(l.loc||'sem local')+'</span><br>'+
'Config B<input type="number" data-a="B" data-i="'+i+'" placeholder="'+(d.B||'?')+'" value="'+(l.B||'')+'"> A<input type="number" data-a="A" data-i="'+i+'" placeholder="'+(d.A||'?')+'" value="'+(l.A||'')+'"> <label><input type="checkbox" data-a="rot" data-i="'+i+'"'+(l.rot?' checked':'')+'> virar</label><button data-a="star" data-i="'+i+'" title="Guardar esta configuração como padrão para este tubo">★ padrão</button><button data-a="del" data-i="'+i+'">✕</button> <span class="m">'+d.w+'×'+d.h+' cm</span></div>'});
G('L').innerHTML=S.lines.length?h+'</div>':'';
var c='<h2>3. Ordem das localizações</h2><div class="card"><label><input type="checkbox" data-a="ord"'+(S.useOrd?' checked':'')+'> Usar a ordem das localizações</label>'+(S.useOrd?'<div class="m">A 1.ª é a primeira a carregar (vai para o lastro).</div>':'');
if(S.useOrd)S.order.forEach(function(x,i){c+='<div class="r">'+(i+1)+'. <b>'+(x||'(sem local)')+'</b> <button data-a="up" data-j="'+i+'">▲</button><button data-a="dn" data-j="'+i+'">▼</button></div>'});
G('LC').innerHTML=S.order.length?c+'</div>':'';sv();if(S.planned)go()}
document.addEventListener('change',function(e){var t=e.target,a=t.getAttribute('data-a');if(!a)return;if(a=='ord'){S.useOrd=t.checked;rl();return}var l=find(t.getAttribute('data-i'));if(!l)return;
if(a=='mine')l.mine=t.checked;else if(a=='rot')l.rot=t.checked;else if(a=='B'||a=='A')l[a]=Math.max(0,Math.round(nm(t.value)));rl()});
document.addEventListener('click',function(e){var t=e.target,a=t.getAttribute&&t.getAttribute('data-a'),id=t.getAttribute&&t.getAttribute('data-id');
if(id){S.done[id]=!S.done[id];sv();draw();return}
if(!a)return;var l=find(t.getAttribute('data-i'));
if(a=='del'&&l)S.lines=S.lines.filter(function(x){return x!==l});
else if(a=='all'){S.lines.forEach(function(l){l.mine=true})}
else if(a=='star'&&l){var d=dims(l);if(d.B&&d.A)S.defs[key(l)]=[d.B,d.A]}
else if(a=='up'||a=='dn'){var i=+t.getAttribute('data-j'),j=a=='up'?i-1:i+1;if(j>=0&&j<S.order.length){var x=S.order[i];S.order[i]=S.order[j];S.order[j]=x}}
else return;rl()});
function bund(rows){var o=[];rows.forEach(function(l){var d=dims(l),N=nb(l);for(var k=0;k<N;k++)o.push({id:l.id+'-'+k,key:l.id,t:lab(l),w:d.w,h:d.h,L:Math.round(l.comp*100),kg:l.kg/N,loc:l.loc,rk:S.useOrd?Math.max(0,S.order.indexOf(l.loc)):0,c:l.id%6+1})});return o}
function mkLanes(bs){bs.sort(function(x,y){return y.L-x.L||y.w-x.w});var ls=[];bs.forEach(function(b){var c=ls.filter(function(l){return (l.loc==b.loc||!S.useOrd)&&l.len+b.L<=LT&&Math.abs(l.w-b.w)<=8&&Math.abs(l.h-b.h)<=6});c.sort(function(p,q){return (q.k==b.key)-(p.k==b.key)||q.len-p.len});var l=c[0];
if(!l){l={items:[],len:0,w:0,h:0,kg:0,k:b.key,loc:b.loc,rk:b.rk};ls.push(l)}l.items.push(b);l.len+=b.L;l.w=Math.max(l.w,b.w);l.h=Math.max(l.h,b.h);l.kg+=b.kg});return ls}
function sum(a,f){return a.reduce(function(s,l){return s+f(l)},0)}
function go(){S.planned=true;var rows=S.lines.filter(function(l){return l.mine});
if(!rows.length){G('out').innerHTML='<div class="card w">Não há linhas escolhidas.</div>';return}
var ls=mkLanes(bund(rows)),fl=ls.slice(),top=[],wn=[],sw=function(){return sum(fl,function(l){return l.w})};
if(sw()>W-2){var hh=fl.map(function(l){return l.h}).sort(function(a,b){return a-b}),md=hh[Math.floor(hh.length/2)];fl.sort(function(a,b){return b.rk-a.rk||Math.abs(b.h-md)-Math.abs(a.h-md)||a.items.length-b.items.length||b.kg-a.kg});while(fl.length>1&&sw()>W-2)top.push(fl.shift())}
function stat(l){l.len=sum(l.items,function(b){return b.L});l.w=Math.max.apply(0,l.items.map(function(b){return b.w}));l.h=Math.max.apply(0,l.items.map(function(b){return b.h}));l.kg=sum(l.items,function(b){return b.kg})}
for(var mv=1;mv;){mv=0;fl.forEach(function(F){if(mv)return;top.forEach(function(Tl){if(mv)return;Tl.items.forEach(function(it,ci){if(mv)return;if(F.len+it.L<=LT&&it.w<=F.w+1&&Math.abs(F.h-it.h)<=6){Tl.items.splice(ci,1);F.items.push(it);stat(F);if(Tl.items.length)stat(Tl);else top.splice(top.indexOf(Tl),1);mv=1}})})})}
var tw0=sw();if(tw0>W)wn.push('Não cabe na largura do camião.');
fl.sort(function(a,b){return a.h-b.h});var arr=[fl.shift()],wl=0,wr=0;fl.forEach(function(l){if(wr<wl){arr.push(l);wr+=l.kg}else{arr.unshift(l);wl+=l.kg}});
var x=(W-tw0)/2,mg=x;arr.forEach(function(l){l.x=x;x+=l.w});
var tq=top.slice().sort(function(a,b){return b.kg-a.kg}),tl=0,tr=0;top=tq.length?[tq.shift()]:[];tq.forEach(function(l){if(tr<tl){top.push(l);tr+=l.kg}else{top.unshift(l);tl+=l.kg}});
var tw=sum(top,function(l){return l.w}),mid=arr[Math.floor((arr.length-1)/2)],st=Math.max(mg,Math.min(W-mg-tw,mid.x+mid.w/2-tw/2)),bat=0,sx=0,hs=[];
if(top.length){bat=tw<=108?120:240;sx=Math.max(0,Math.min(W-bat,st+tw/2-bat/2));var t=st;top.forEach(function(l){l.x=t;t+=l.w});arr.forEach(function(l){if(l.x+l.w>sx&&l.x<sx+bat)hs.push(l.h)});if(tw>228)wn.push('Camada de cima muito larga.')}
O=[];function put(l,ly){var y=0;l.items.sort(function(a,b){return a.kg-b.kg});l.items.forEach(function(b){O.push({id:b.id,l:ly,rk:b.rk,loc:b.loc,x:l.x+(l.w-b.w)/2,y:y,w:b.w,h:b.h,L:b.L,t:b.t,kg:b.kg,c:b.c});y+=b.L});if(y>LT+.5)wn.push('Uma fila é maior que o camião.')}
arr.forEach(function(l){put(l,0)});top.forEach(function(l){put(l,1)});
O.sort(function(a,b){return a.rk-b.rk||a.l-b.l||a.x-b.x||a.y-b.y});O.forEach(function(b,i){b.n=i+1});
var f=0,r=0,e=0,d=0;O.forEach(function(b){var q=Math.max(0,Math.min(b.y+b.L,LT/2)-b.y)/b.L;f+=b.kg*q;r+=b.kg*(1-q);var ql=Math.max(0,Math.min(b.x+b.w,W/2)-b.x)/b.w;e+=b.kg*ql;d+=b.kg*(1-ql)});
var info='Total '+fmt(f+r)+' kg · frente '+fmt(f)+' · trás '+fmt(r)+' · esquerda '+fmt(e)+' · direita '+fmt(d)+' · '+O.length+' atados';
if(top.length){var df=hs.length?Math.max.apply(0,hs)-Math.min.apply(0,hs):0;info+='<br>Barrotes de '+bat+' cm na faixa a tracejado. Chão nivelado só aí: diferença de '+df+' cm'+(df>4?' (grande, rever)':'')+'.'}
window.PL={bat:bat,sx:sx};
G('out').innerHTML=(wn.length?'<div class="card w">'+wn.join('<br>')+'</div>':'')+'<h2>4. Plano</h2><div class="card m">'+info+'</div><div class="card m">Tamanho do desenho <input type="range" id="zm" min="120" max="800" step="10" value="'+zv()+'" style="width:60%"></div><div class="lays"><div><h2>1.ª camada (chão)</h2><div id="s0" class="sv"></div></div>'+(top.length?'<div><h2>2.ª camada</h2><div id="s1" class="sv"></div></div>':'')+'</div>'+
'<div class="card m">Toca num atado para o marcar como carregado. O número é a ordem de carga. Se mudares algo depois de marcar atados, o plano refaz-se e as posições podem mudar. Medidas estimadas pelo nº de peças quando não há configuração guardada.</div><h2>Atados</h2><div class="card tb"><table id="tb"></table></div>';
var h='<tr><th>#</th><th>Local</th><th>Tubo</th><th>L×A×C cm</th><th>kg</th></tr>';O.forEach(function(b){h+='<tr><td>'+b.n+'</td><td>'+(b.loc||'-')+'</td><td>'+b.t+'</td><td>'+b.w+'×'+b.h+'×'+b.L+'</td><td>'+fmt(b.kg)+'</td></tr>'});G('tb').innerHTML=h;sv();draw()}
function svg(l){var P=window.PL,s='<svg viewBox="0 -24 '+W+' '+(LT+48)+'"><rect x="0" y="0" width="'+W+'" height="'+LT+'" fill="none" stroke="currentColor" stroke-width="1"/><text x="'+W/2+'" y="-8" style="font-size:9px">▲ FRENTE (cabine)</text><text x="'+W/2+'" y="'+(LT+16)+'" style="font-size:9px">TRASEIRA ▼</text>';
O.forEach(function(b){if(l==1&&b.l==0)s+='<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.L+'" fill="none" stroke="var(--mut)" stroke-dasharray="3 3" stroke-width=".4"/>'});
O.forEach(function(b){if(b.l!=l)return;var cx=b.x+b.w/2,cy=b.y+b.L/2,d=S.done[b.id];s+='<rect class="bd'+(d?' done':'')+'" data-id="'+b.id+'" x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.L+'" fill="var(--b'+b.c+')"/><text x="'+cx+'" y="'+(cy-12)+'" style="font-size:12px;font-weight:700">'+(d?'✓':b.n)+'</text><text x="'+cx+'" y="'+(cy+2)+'">'+b.t+'</text><text x="'+cx+'" y="'+(cy+10)+'">'+fmt(b.kg)+' kg</text><text x="'+cx+'" y="'+(cy+18)+'">'+b.w+'×'+b.h+' cm</text><text x="'+cx+'" y="'+(cy+26)+'">'+(b.loc||'')+'</text>'});
if(P.bat&&l==0)s+='<rect x="'+P.sx+'" y="0" width="'+P.bat+'" height="'+LT+'" fill="none" stroke="var(--ok)" stroke-width="1" stroke-dasharray="5 4" style="pointer-events:none"/>';
return s+'</svg>'}
function draw(){G('s0').innerHTML=svg(0);if(G('s1'))G('s1').innerHTML=svg(1)}
function zv(){return S.zoom||(innerWidth<700?Math.max(120,innerWidth-28):260)}
document.addEventListener('input',function(e){if(e.target.id=='zm'){S.zoom=+e.target.value;document.documentElement.style.setProperty('--sw',S.zoom+'px');sv()}});
document.documentElement.style.setProperty('--sw',zv()+'px');
G('go').onclick=go;rl();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
